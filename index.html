<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonder Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h4>Карта Бажань</h4>
        <table class="table">
            <tr>
                <td class="purple">
                    <h4>Фінанси</h4>
                    <input type="file" class="photoInput" accept="image/*"> 
                    <img class="preview">
                </td>
                <td class="red">
                    <h4>Кохання</h4>
                    <input type="file" class="photoInput" accept="image/*">
                    <img class="preview"> 
                </td>
                <td class="rose">
                    <h4>Мрія</h4>
                    <input type="file" class="photoInput" accept="image/*">
                    <img class="preview">  
                </td>
            </tr> 
            <tr>
                <td class="green">
                    <h4>Родина</h4>
                    <input type="file" class="photoInput" accept="image/*">
                     <img class="preview"> 
                    </td>
                <td class="yellow">
                    <h4>Здоров'я</h4>
                    <input type="file" class="photoInput" accept="image/*">
                     <img class="preview"> 
                    </td>
                <td class="gold">
                    <h4>Мистецтво</h4>
                    <input type="file" class="photoInput" accept="image/*"> 
                    <img class="preview">
                 </td>
            </tr>
            <tr>
                <td class="brown">
                    <h4>Навчання</h4>
                    <input type="file" class="photoInput" accept="image/*">
                    <img class="preview"> 
                 </td>
                <td class="blue">
                    <h4>Успіх</h4>
                    <input type="file" class="photoInput" accept="image/*">
                     <img class="preview"> 
                    </td>
                <td class="grey">
                    <h4>Подорожі</h4>
                    <input type="file" class="photoInput" accept="image/*"> 
                    <img class="preview"> 
                </td>
            </tr>
        </table>
    </div>
    <script src="wc.js"></script>
</body>
</html>
