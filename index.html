<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonder Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h4>Карта Бажань</h4>
        <table class="table">
            <tr>
                <td class="purple"><input type="file" class="photoInput" accept="image/*"> <img class="preview"></td>
                <td class="red"><input type="file" class="photoInput" accept="image/*"><img class="preview"> </td>
                <td class="rose"><input type="file" class="photoInput" accept="image/*"><img class="preview">  </td>
            </tr> 
            <tr>
                <td class="green"><input type="file" class="photoInput" accept="image/*"> <img class="preview"> </td>
                <td class="yellow"><input type="file" class="photoInput" accept="image/*"> <img class="preview"> </td>
                <td class="gold"><input type="file" class="photoInput" accept="image/*"> <img class="preview"> </td>
            </tr>
            <tr>
                <td class="brown"><input type="file" class="photoInput" accept="image/*"><img class="preview">  </td>
                <td class="blue"><input type="file" class="photoInput" accept="image/*"> <img class="preview"> </td>
                <td class="grey"><input type="file" class="photoInput" accept="image/*"> <img class="preview"> </td>
            </tr>
        </table>
    </div>
    <script src="wc.js"></script>
</body>
</html>
